<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFO - Test Probe</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    p.sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .metric {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .metric-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }
    .metric-value.highlight {
      color: var(--primary);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .version-badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-weight: 600;
    }
    .status-success {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    button {
      width: 100%;
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>WFO Network Probe <span class="version-badge">v0.1</span></h1>
    <p class="sub">Testing live connection via <code>GitHub REST API</code></p>

    <div id="status" class="status-badge status-success">Connecting...</div>

    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">Ping Response</div>
        <div id="ping-val" class="metric-value highlight">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">Round-Trip Latency</div>
        <div id="latency-val" class="metric-value">-- ms</div>
      </div>
      <div class="metric">
        <div class="metric-label">Devices Loaded</div>
        <div id="devices-val" class="metric-value">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">Colors Loaded</div>
        <div id="colors-val" class="metric-value">--</div>
      </div>
    </div>

    <button id="test-btn" onclick="testConnection()">Re-test Latency</button>
  </div>

  <script>
    async function testConnection() {
      const btn = document.getElementById('test-btn');
      const statusEl = document.getElementById('status');
      const pingEl = document.getElementById('ping-val');
      const latencyEl = document.getElementById('latency-val');
      const devicesEl = document.getElementById('devices-val');
      const colorsEl = document.getElementById('colors-val');

      btn.disabled = true;
      statusEl.className = 'status-badge';
      statusEl.textContent = 'Fetching...';

      const startTime = performance.now();

      try {
        let data;
        let transport = 'GitHub REST API';

        // 1. Try instant GitHub REST API first (0-delay updates)
        try {
          const apiRes = await fetch('https://api.github.com/repos/spamfan/workflowoptimizer/contents/stats.json', {
            headers: { 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });
          if (!apiRes.ok) throw new Error('API ' + apiRes.status);
          const rawApiData = await apiRes.json();
          // Decode Base64 content from GitHub API
          const decodedJsonString = decodeURIComponent(escape(atob(rawApiData.content.replace(/\s/g, ''))));
          data = JSON.parse(decodedJsonString);
        } catch (apiErr) {
          // 2. Fallback to local ./stats.json if API is restricted or rate-limited
          transport = 'Local Fallback';
          const localRes = await fetch('./stats.json?t=' + Date.now());
          if (!localRes.ok) throw new Error('Local ' + localRes.status);
          data = await localRes.json();
        }

        const endTime = performance.now();
        const duration = (endTime - startTime).toFixed(1);

        statusEl.className = 'status-badge status-success';
        statusEl.textContent = `Connected via ${transport} (HTTP 200 OK)`;

        pingEl.textContent = data.ping !== undefined ? String(data.ping) : 'N/A';
        latencyEl.textContent = duration + ' ms';
        devicesEl.textContent = data.devices ? Object.keys(data.devices).length : 0;
        colorsEl.textContent = data.colors ? Object.keys(data.colors).length : 0;

      } catch (err) {
        const endTime = performance.now();
        const duration = (endTime - startTime).toFixed(1);

        statusEl.className = 'status-badge status-error';
        statusEl.textContent = 'Failed: ' + err.message;

        pingEl.textContent = 'Error';
        latencyEl.textContent = duration + ' ms';
        devicesEl.textContent = '0';
        colorsEl.textContent = '0';
      } finally {
        btn.disabled = false;
      }
    }

    // Run automatically on initial load
    testConnection();
  </script>
</body>
</html>
